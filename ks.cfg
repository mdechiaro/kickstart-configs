# fedora silverblue kickstart
graphical
firewall --use-system-defaults
firstboot --enable --reconfig
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8
ostreesetup --osname=fedora --remote=fedora --url="file:///ostree/repo" --ref=fedora/44/x86_64/silverblue --nogpg
reboot
rootpw --lock
timesource --ntp-pool north-america.pool.ntp.org
timezone America/Chicago --utc

# disk setup
ignoredisk --only-use=sda
clearpart --drives=sda --all --initlabel
bootloader --location=mbr --boot-drive=sda
part /boot/efi --fstype=efi --grow --maxsize=204 --size=20
part /boot --fstype="xfs" --ondisk=sda --size=1024
part pv.01 --size=51200 --ondisk=sda --grow
volgroup vg01 pv.01
logvol /  --fstype="xfs" --size=15360 --label="rootvol" --name=root --vgname=vg01
logvol /tmp  --fstype="xfs" --size=5120 --name=tmp --vgname=vg01
logvol /var  --fstype="xfs" --size=10240 --name=var --vgname=vg01
logvol /var/home  --fstype="xfs" --size=10240 --name=home --vgname=vg01
logvol /var/lib/incus  --fstype="xfs" --size=15360 --name=incus --vgname=vg01
logvol swap  --fstype="swap" --size=8192 --name=swap --vgname=vg01
zerombr

%post --erroronfail
cp /etc/skel/.bash* /root
%end

# sudoers
%post --log /root/ks-sudoers-nopass.log
cat <<EOF> /etc/sudoers.d/wheel_nopass
%wheel        ALL=(ALL)       NOPASSWD: ALL
EOF
%end

# dns over tls
%post --log /root/ks-dns-tls.log

mkdir /etc/systemd/resolved.conf.d
cat <<EOF> /etc/systemd/resolved.conf.d/10-dns-over-tls.conf
[Resolve]
# dns.quad9.net
DNS=9.9.9.9 149.112.112.112 2620:fe::fe 2620:fe::9
DNSOverTLS=yes
Domains=~.
# cloudflare-dns.com
FallbackDNS=1.1.1.1 1.0.0.1 2606:4700:4700::1111 2606:4700:4700::1001
EOF
%end
